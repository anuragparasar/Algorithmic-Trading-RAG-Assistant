services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      HF_HUB_OFFLINE: "1"   # models are already in the hf_cache volume; skip Hub checks at startup
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}   # override: GEMINI_MODEL=... docker compose up -d api
    volumes:
      - qdrant_data:/app/deriv_rag_db
      - hf_cache:/models
    restart: unless-stopped

  # One-off job: docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "deriv_rag_pipeline.py"]
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - qdrant_data:/app/deriv_rag_db
      - hf_cache:/models
    profiles: ["ingest"]

  frontend:
    build: ./frontend
    ports:
      - "5173:80"   # keeps the origin at localhost:5173 so your CORS config still matches
    depends_on:
      - api

volumes:
  qdrant_data:
  hf_cache: